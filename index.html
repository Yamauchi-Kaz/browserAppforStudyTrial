<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>こたえてバトル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="btn-sound" class="sound-btn" type="button" aria-label="音を消す">🔊</button>
  <div class="hurt-flash" id="hurt-flash"></div>
  <main id="app">
    <!-- タイトル画面 -->
    <section id="screen-title" class="screen active">
      <h1>⚔️ こたえてバトル ⚔️</h1>
      <p class="lead">もんだいに にほんごで こたえて、モンスターを たおそう！<br>はやく こたえるほど、おおダメージ！</p>
      <div class="title-show">
        <canvas id="title-stage" class="title-canvas"></canvas>
        <div class="title-monster" id="title-monster-name"></div>
      </div>

      <div class="panel">
        <h2>きょうか をえらぼう</h2>
        <div id="subject-list" class="chips"></div>
      </div>

      <div class="panel">
        <h2>むずかしさ</h2>
        <div class="chips" id="level-list">
          <label class="chip"><input type="radio" name="level" value="easy"><span>やさしい（30びょう）</span></label>
          <label class="chip"><input type="radio" name="level" value="normal" checked><span>ふつう（20びょう）</span></label>
          <label class="chip"><input type="radio" name="level" value="hard"><span>むずかしい（12びょう）</span></label>
        </div>
      </div>

      <div class="panel">
        <h2>こたえかた</h2>
        <div class="chips">
          <label class="chip"><input type="radio" name="mode" id="mode-keyboard" value="keyboard" checked><span>⌨️ キーボード</span></label>
          <label class="chip"><input type="radio" name="mode" id="mode-voice" value="voice"><span>🎤 おはなし（こえで こたえる）</span></label>
        </div>
        <div class="chips" id="read-panel">
          <label class="chip"><input type="checkbox" id="opt-read" checked><span>🔈 もんだいを よみあげる</span></label>
        </div>
        <p class="note" id="voice-note" hidden>この ブラウザーでは こえで こたえられません。Chrome・Edge・Safari で ひらいてね。</p>
      </div>

      <button id="btn-start" class="btn big">スタート！</button>
    </section>

    <!-- バトル画面 -->
    <section id="screen-battle" class="screen">
      <div class="status-row">
        <div class="stage" id="stage-label">ステージ 1</div>
        <div class="score">スコア <span id="score">0</span></div>
      </div>

      <div class="enemy-area">
        <div class="enemy-head">
          <span class="enemy-name" id="enemy-name"></span>
          <div class="hpbar enemy"><div class="hpfill" id="enemy-hp-fill"></div><span id="enemy-hp-text"></span></div>
        </div>
        <canvas id="stage" class="stage-canvas"></canvas>
        <div class="banner" id="banner"></div>
      </div>

      <div class="question-box">
        <div class="q-head">
          <div class="subject-tag" id="subject-tag"></div>
          <button type="button" id="btn-read" class="read-btn" aria-label="もんだいを もういちど よむ" hidden>🔈 もういちど</button>
        </div>
        <div class="question" id="question-text"></div>
        <div class="timer"><div class="timer-fill" id="timer-fill"></div></div>
      </div>

      <form id="answer-form" class="answer-row" autocomplete="off">
        <input id="answer-input" type="text" placeholder="こたえ" enterkeyhint="send">
        <button type="button" id="btn-mic" class="btn mic" title="こえで こたえる" hidden>🎤</button>
        <button type="submit" class="btn">こたえる</button>
      </form>

      <div class="heard" id="heard"></div>
      <div class="feedback" id="feedback"></div>

      <div class="player-area">
        <div class="player-label">きみ 🧒 <span id="combo"></span></div>
        <div class="hpbar player"><div class="hpfill" id="player-hp-fill"></div><span id="player-hp-text"></span></div>
      </div>

      <div class="mark" id="mark"></div>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen">
      <h1 id="result-title"></h1>
      <div class="panel result">
        <p>スコア：<strong id="result-score">0</strong></p>
        <p>せいかい：<strong id="result-correct">0</strong> もん ／ じかんぎれ：<strong id="result-timeout">0</strong> かい</p>
        <p>たおしたモンスター：<strong id="result-defeated">0</strong> ひき</p>
      </div>
      <div class="panel" id="review-panel">
        <h2>まちがえた もんだいを ふりかえろう</h2>
        <ul id="review-list"></ul>
      </div>
      <button id="btn-retry" class="btn big">もういちど</button>
    </section>
  </main>

  <script src="js/judge.js"></script>
  <script src="js/art.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/speaker.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
