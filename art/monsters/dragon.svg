<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="dr-skin" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ff9a6a"/>
      <stop offset="0.4" stop-color="#e64a22"/>
      <stop offset="0.85" stop-color="#a51f10"/>
      <stop offset="1" stop-color="#6b120b"/>
    </radialGradient>
    <linearGradient id="dr-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#ffcc55"/>
      <stop offset="1" stop-color="#e3922a"/>
    </linearGradient>
    <linearGradient id="dr-horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9c08a"/>
      <stop offset="1" stop-color="#fffaea"/>
    </linearGradient>
    <linearGradient id="dr-snout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8352"/>
      <stop offset="1" stop-color="#c7351a"/>
    </linearGradient>
    <radialGradient id="dr-fire" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="0.5" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff4d00"/>
    </radialGradient>
    <linearGradient id="dr-frill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2611b"/>
    </linearGradient>
    <clipPath id="dr-torso-clip"><path id="dr-torso" d="M170 252 C146 300 144 396 184 446 L328 446 C368 396 366 300 342 252 C318 226 194 226 170 252 Z"/></clipPath>
  </defs>
  <g stroke="#2a0d0a" stroke-linejoin="round">
    <!-- せなかのトゲ（うしろ） -->
    <path d="M176 262 L150 222 L196 238 Z M336 262 L362 222 L316 238 Z M206 236 L196 196 L232 222 Z M306 236 L316 196 L280 222 Z" fill="url(#dr-frill)" stroke-width="5"/>

    <!-- ふともも・足 -->
    <ellipse cx="190" cy="420" rx="54" ry="58" fill="url(#dr-skin)" stroke-width="7"/>
    <ellipse cx="322" cy="420" rx="54" ry="58" fill="url(#dr-skin)" stroke-width="7"/>
    <path d="M146 486 C146 462 166 452 190 452 C214 452 230 462 230 486 Z" fill="#c7351a" stroke-width="6"/>
    <path d="M282 486 C282 462 298 452 322 452 C346 452 366 462 366 486 Z" fill="#a51f10" stroke-width="6"/>
    <path d="M150 486 l-8 12 l18 -2 Z M180 488 l-2 12 l14 -4 Z M210 486 l4 12 l12 -8 Z M302 486 l-4 12 l-12 -8 Z M332 488 l2 12 l-14 -4 Z M362 486 l8 12 l-18 -2 Z" fill="#fff3d6" stroke-width="4"/>
  </g>

  <!-- 胴体 -->
  <use href="#dr-torso" fill="url(#dr-skin)"/>
  <g clip-path="url(#dr-torso-clip)">
    <!-- おなかのじゃばら -->
    <path d="M206 262 C220 250 292 250 306 262 C324 320 322 400 300 452 L212 452 C190 400 188 320 206 262 Z" fill="url(#dr-belly)" stroke="#2a0d0a" stroke-width="5"/>
    <g fill="none" stroke="#b8741a" stroke-width="4" stroke-linecap="round">
      <path d="M204 290 Q256 302 308 290"/>
      <path d="M200 320 Q256 334 312 320"/>
      <path d="M200 352 Q256 366 312 352"/>
      <path d="M202 384 Q256 398 310 384"/>
      <path d="M208 416 Q256 428 304 416"/>
    </g>
    <path d="M218 270 C214 300 214 340 220 380" fill="none" stroke="#fffbe0" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- 右がわのかげ -->
    <path d="M320 240 C360 300 370 380 330 460 L520 460 L520 200 Z" fill="#5e0f0a" opacity="0.35"/>
  </g>
  <use href="#dr-torso" fill="none" stroke="#2a0d0a" stroke-width="7"/>
  <!-- ウロコ -->
  <g fill="none" stroke="#7a150b" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <path d="M176 290 q8 8 16 0 M172 314 q8 8 16 0 M182 302 q8 8 16 0 M170 404 q8 8 16 0 M186 392 q8 8 16 0"/>
    <path d="M320 290 q8 8 16 0 M324 314 q8 8 16 0 M314 302 q8 8 16 0 M326 404 q8 8 16 0 M310 392 q8 8 16 0"/>
  </g>

  <!-- うで（つめを立てて かまえる） -->
  <g stroke="#2a0d0a" stroke-linejoin="round" stroke-linecap="round">
    <path d="M182 270 C156 286 136 306 128 334" fill="none" stroke-width="34"/>
    <path d="M182 270 C156 286 136 306 128 334" fill="none" stroke="#d63c1c" stroke-width="22"/>
    <path d="M330 270 C356 286 376 306 384 334" fill="none" stroke-width="34"/>
    <path d="M330 270 C356 286 376 306 384 334" fill="none" stroke="#b8291a" stroke-width="22"/>
    <circle cx="126" cy="340" r="20" fill="#d63c1c" stroke-width="6"/>
    <circle cx="386" cy="340" r="20" fill="#b8291a" stroke-width="6"/>
    <path d="M110 330 l-14 -14 l18 4 Z M118 322 l-6 -20 l14 12 Z M132 322 l2 -20 l8 16 Z M402 330 l14 -14 l-18 4 Z M394 322 l6 -20 l-14 12 Z M380 322 l-2 -20 l-8 16 Z" fill="#fff3d6" stroke-width="4"/>
  </g>

  <!-- 首 -->
  <path d="M220 200 L292 200 L300 252 C280 262 232 262 212 252 Z" fill="#c7351a" stroke="#2a0d0a" stroke-width="6" stroke-linejoin="round"/>
  <path d="M232 214 Q256 222 280 214 M230 234 Q256 242 282 234" fill="none" stroke="#ffcc55" stroke-width="6" stroke-linecap="round"/>

  <g stroke="#2a0d0a" stroke-linejoin="round">
    <!-- つの -->
    <path d="M214 96 C196 70 170 50 138 40 C154 60 168 84 178 112 Z" fill="url(#dr-horn)" stroke-width="6"/>
    <path d="M298 96 C316 70 342 50 374 40 C358 60 344 84 334 112 Z" fill="url(#dr-horn)" stroke-width="6"/>
    <path d="M180 72 l10 10 M166 58 l10 8 M332 72 l-10 10 M346 58 l-10 8" stroke-width="3"/>
    <!-- ほおのヒレ -->
    <path d="M190 132 L142 118 L168 140 L130 150 L170 160 L146 180 L196 170 Z" fill="url(#dr-frill)" stroke-width="5"/>
    <path d="M322 132 L370 118 L344 140 L382 150 L342 160 L366 180 L316 170 Z" fill="url(#dr-frill)" stroke-width="5"/>
    <!-- 頭 -->
    <path d="M186 140 C182 96 214 72 256 72 C298 72 330 96 326 140 C324 168 306 184 256 186 C206 184 188 168 186 140 Z" fill="url(#dr-skin)" stroke-width="7"/>
    <!-- 頭のトゲ -->
    <path d="M236 78 L244 52 L254 76 M258 76 L268 50 L276 78" fill="#ffb347" stroke-width="5"/>
    <!-- 口の中（火がもれる） -->
    <path d="M206 196 C220 230 292 230 306 196 Z" fill="#3a0606" stroke-width="6"/>
    <ellipse cx="256" cy="212" rx="34" ry="12" fill="url(#dr-fire)" stroke="none"/>
    <!-- 鼻づら -->
    <path d="M196 170 C196 146 222 136 256 136 C290 136 316 146 316 170 C316 196 292 206 256 206 C220 206 196 196 196 170 Z" fill="url(#dr-snout)" stroke-width="6"/>
    <path d="M214 160 C226 148 286 148 298 160" fill="none" stroke="#ffb08a" stroke-width="5" stroke-linecap="round"/>
    <!-- 鼻のあな -->
    <path d="M232 176 q8 -10 16 0 q-8 6 -16 0 Z M264 176 q8 -10 16 0 q-8 6 -16 0 Z" fill="#3a0606" stroke-width="3"/>
    <!-- きば -->
    <path d="M214 198 L222 220 L230 202 Z M282 202 L290 220 L298 198 Z M240 206 L246 218 L252 207 Z M260 207 L266 218 L272 206 Z" fill="#ffffff" stroke-width="3"/>
  </g>
  <!-- 口の火 -->
  <path d="M300 214 C316 206 324 196 322 184 C332 194 336 208 330 222 C340 220 346 214 348 206 C356 222 344 240 324 240 C310 240 300 230 300 214 Z" fill="url(#dr-fire)" stroke="#a83000" stroke-width="3"/>
  <!-- 頭のつや -->
  <path d="M206 108 C220 88 246 80 268 82" fill="none" stroke="#ffd2b0" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
</svg>
