<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mg-robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5468d6"/>
      <stop offset="0.45" stop-color="#2c379a"/>
      <stop offset="1" stop-color="#151b55"/>
    </linearGradient>
    <linearGradient id="mg-hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6476e0"/>
      <stop offset="0.6" stop-color="#2d389c"/>
      <stop offset="1" stop-color="#18205e"/>
    </linearGradient>
    <linearGradient id="mg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.5" stop-color="#f2b938"/>
      <stop offset="1" stop-color="#a8650f"/>
    </linearGradient>
    <linearGradient id="mg-lining" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b2f9e"/>
      <stop offset="1" stop-color="#3b0f55"/>
    </linearGradient>
    <radialGradient id="mg-void" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#1a1235"/>
      <stop offset="1" stop-color="#05030c"/>
    </radialGradient>
    <radialGradient id="mg-gem" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffd0d6"/>
      <stop offset="0.4" stop-color="#ff3355"/>
      <stop offset="1" stop-color="#7a0018"/>
    </radialGradient>
    <clipPath id="mg-robe-clip">
      <path id="mg-robe-shape" d="M196 238 C164 290 136 360 112 470 L140 448 L160 480 L188 452 L214 486 L240 458 L262 490 L288 458 L314 484 L338 452 L362 478 L384 446 L404 466 C380 360 352 290 318 238 Z"/>
    </clipPath>
  </defs>

  <!-- ローブ -->
  <use href="#mg-robe-shape" fill="url(#mg-robe)"/>
  <g clip-path="url(#mg-robe-clip)">
    <!-- 前あわせの内側 -->
    <path d="M240 250 C232 330 220 400 206 500 L312 500 C296 400 284 330 276 250 Z" fill="url(#mg-lining)"/>
    <!-- しわ -->
    <g fill="none" stroke-linecap="round">
      <path d="M182 300 C168 360 156 410 150 470" stroke="#0f1440" stroke-width="7" opacity="0.5"/>
      <path d="M196 300 C186 360 178 410 174 460" stroke="#7e8ff0" stroke-width="4" opacity="0.45"/>
      <path d="M338 300 C350 360 362 410 370 470" stroke="#0f1440" stroke-width="7" opacity="0.6"/>
      <path d="M262 330 C258 390 260 440 262 490" stroke="#22073a" stroke-width="6" opacity="0.5"/>
    </g>
    <!-- 右がわのかげ -->
    <path d="M300 230 C360 300 400 380 420 500 L520 500 L520 200 Z" fill="#0a0d33" opacity="0.35"/>
    <!-- すそのルーン -->
    <g fill="none" stroke="#7df9ff" stroke-width="3" opacity="0.55" stroke-linecap="round">
      <path d="M150 440 v-26 M150 422 l11 -8 M150 431 l11 -8"/>
      <path d="M182 440 v-26 M172 416 l10 10 l10 -10"/>
      <path d="M334 440 v-26 M334 420 l12 7 l-12 7"/>
      <path d="M364 414 l-6 26 M356 414 l14 0 M352 428 h16"/>
    </g>
  </g>
  <!-- 前あわせの金のふち -->
  <g clip-path="url(#mg-robe-clip)">
    <path d="M240 250 C232 330 220 400 206 500" fill="none" stroke="url(#mg-gold)" stroke-width="9"/>
    <path d="M276 250 C284 330 296 400 310 500" fill="none" stroke="url(#mg-gold)" stroke-width="9"/>
  </g>
  <use href="#mg-robe-shape" fill="none" stroke="#120c26" stroke-width="7" stroke-linejoin="round"/>

  <!-- 左のそで（まほうをためる手） -->
  <path d="M200 252 C170 270 140 290 112 306 L138 342 C164 326 190 314 214 304 Z" fill="url(#mg-hood)" stroke="#120c26" stroke-width="6" stroke-linejoin="round"/>
  <path d="M108 304 L142 346" stroke="url(#mg-gold)" stroke-width="8" stroke-linecap="round"/>
  <g stroke="#120c26" stroke-width="5" stroke-linejoin="round" fill="#c4bdd6">
    <ellipse cx="88" cy="276" rx="7" ry="17" transform="rotate(-30 88 276)"/>
    <ellipse cx="104" cy="268" rx="7" ry="18" transform="rotate(-8 104 268)"/>
    <ellipse cx="120" cy="272" rx="7" ry="16" transform="rotate(18 120 272)"/>
    <ellipse cx="78" cy="300" rx="7" ry="14" transform="rotate(-70 78 300)"/>
    <path d="M86 294 C84 280 96 274 108 276 C122 278 128 290 126 302 C124 316 110 324 98 320 C88 316 86 306 86 294 Z"/>
  </g>
  <path d="M96 290 q10 -6 20 0" fill="none" stroke="#8f86a8" stroke-width="3" stroke-linecap="round"/>

  <!-- 右のそで（つえを持つ） -->
  <path d="M312 252 C342 266 366 282 386 300 L362 330 C344 316 322 306 300 302 Z" fill="url(#mg-hood)" stroke="#120c26" stroke-width="6" stroke-linejoin="round"/>
  <path d="M388 296 L364 334" stroke="url(#mg-gold)" stroke-width="8" stroke-linecap="round"/>
  <!-- ケープ（かた） -->
  <path d="M176 232 C200 214 316 214 340 232 C350 258 340 282 320 290 C290 270 226 270 196 290 C176 282 166 258 176 232 Z" fill="url(#mg-hood)" stroke="#120c26" stroke-width="6" stroke-linejoin="round"/>
  <path d="M196 290 C226 270 290 270 320 290" fill="none" stroke="url(#mg-gold)" stroke-width="7" stroke-linecap="round"/>

  <!-- ペンダント -->
  <path d="M232 276 L258 304 L284 276" fill="none" stroke="#c7891f" stroke-width="4"/>
  <path d="M258 296 L274 312 L258 336 L242 312 Z" fill="url(#mg-gem)" stroke="#120c26" stroke-width="5" stroke-linejoin="round"/>
  <path d="M252 306 L258 300 L262 306" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- フード -->
  <path d="M168 236 C150 180 168 110 222 82 C262 60 316 46 360 30 C346 62 346 86 334 112 C350 150 352 200 340 238 C310 254 200 254 168 236 Z" fill="url(#mg-hood)" stroke="#120c26" stroke-width="7" stroke-linejoin="round"/>
  <!-- フードのしわとつや -->
  <path d="M200 110 C224 92 262 80 300 66" fill="none" stroke="#8d9cff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M330 116 C342 150 344 190 336 226" fill="none" stroke="#0d1240" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <!-- 顔の暗やみ -->
  <path d="M196 226 C186 176 204 130 252 122 C300 118 322 160 318 226 C292 240 222 240 196 226 Z" fill="url(#mg-void)" stroke="#120c26" stroke-width="5"/>
  <!-- フードの金のふち -->
  <path d="M190 232 C176 176 196 120 252 112 C306 108 330 160 324 232" fill="none" stroke="url(#mg-gold)" stroke-width="8" stroke-linecap="round"/>
</svg>
