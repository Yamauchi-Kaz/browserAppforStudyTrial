<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sl-body" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#eaffc2"/>
      <stop offset="0.28" stop-color="#a6eb6a"/>
      <stop offset="0.7" stop-color="#4fbf43"/>
      <stop offset="1" stop-color="#2a8a35"/>
    </radialGradient>
    <linearGradient id="sl-ao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.72" stop-color="#14532a" stop-opacity="0"/>
      <stop offset="1" stop-color="#14532a" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sl-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2ffd0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f2ffd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sl-iris" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#5a8cff"/>
      <stop offset="0.55" stop-color="#2440a8"/>
      <stop offset="1" stop-color="#0d1440"/>
    </radialGradient>
    <radialGradient id="sl-cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a95" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff7a95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sl-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f57a"/>
      <stop offset="1" stop-color="#3f9e3a"/>
    </linearGradient>
    <linearGradient id="sl-mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0c1c"/>
      <stop offset="1" stop-color="#7a1f35"/>
    </linearGradient>
    <clipPath id="sl-clip">
      <path id="sl-shape" d="M90 470 C52 468 42 424 52 376 C70 268 146 190 256 188 C366 190 442 268 460 376 C470 424 460 468 422 470 Q256 500 90 470 Z"/>
    </clipPath>
  </defs>

  <!-- したたり（うしろ） -->
  <path d="M396 470 C404 482 408 492 404 500 C400 508 388 508 386 500 C384 492 388 482 396 470 Z" fill="#3aa23c" stroke="#1d3b22" stroke-width="5"/>
  <ellipse cx="392" cy="496" rx="3" ry="4" fill="#ffffff" opacity="0.7"/>

  <!-- 体 -->
  <use href="#sl-shape" fill="url(#sl-body)"/>
  <g clip-path="url(#sl-clip)">
    <!-- 体の中のひかり -->
    <ellipse cx="250" cy="392" rx="150" ry="62" fill="url(#sl-core)"/>
    <!-- かげ（右下） -->
    <path d="M330 190 C430 230 470 340 460 470 L300 500 C380 430 400 300 330 190 Z" fill="#257a33" opacity="0.38"/>
    <!-- 地面ちかくの暗さ -->
    <rect x="0" y="0" width="512" height="512" fill="url(#sl-ao)"/>
    <!-- 中のあわ -->
    <g fill="none" stroke="#f3ffe0" stroke-opacity="0.55" stroke-width="3">
      <circle cx="150" cy="420" r="9"/>
      <circle cx="176" cy="446" r="5"/>
      <circle cx="372" cy="404" r="11"/>
      <circle cx="350" cy="440" r="6"/>
      <circle cx="300" cy="250" r="6"/>
    </g>
    <!-- ふちの照りかえし（右） -->
    <path d="M370 222 C426 270 456 334 458 412" fill="none" stroke="#e8ffcf" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  </g>
  <use href="#sl-shape" fill="none" stroke="#1d3b22" stroke-width="7" stroke-linejoin="round"/>
  <clipPath id="sl-bottom"><rect x="0" y="420" width="512" height="92"/></clipPath>
  <use href="#sl-shape" fill="none" stroke="#1d3b22" stroke-width="12" stroke-linejoin="round" clip-path="url(#sl-bottom)"/>

  <!-- つや -->
  <path d="M128 330 C122 268 166 214 224 204 C190 236 166 280 162 336 C156 352 132 350 128 330 Z" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="248" cy="198" rx="16" ry="7" fill="#ffffff" opacity="0.8" transform="rotate(-8 248 198)"/>
  <circle cx="150" cy="364" r="7" fill="#ffffff" opacity="0.7"/>

  <!-- 双葉 -->
  <path d="M256 180 C256 158 260 140 270 124" fill="none" stroke="#1d3b22" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 180 C256 158 260 140 270 124" fill="none" stroke="#7a9a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M268 126 C236 128 206 112 196 84 C230 78 262 96 268 126 Z" fill="url(#sl-leaf)" stroke="#1d3b22" stroke-width="5" stroke-linejoin="round"/>
  <path d="M266 122 C244 112 222 100 206 88" fill="none" stroke="#2f7a2e" stroke-width="3" stroke-linecap="round"/>
  <path d="M272 124 C292 96 324 84 356 92 C346 122 306 136 272 124 Z" fill="url(#sl-leaf)" stroke="#1d3b22" stroke-width="5" stroke-linejoin="round"/>
  <path d="M276 122 C298 110 322 100 344 96" fill="none" stroke="#2f7a2e" stroke-width="3" stroke-linecap="round"/>
  <path d="M214 92 C226 92 238 98 246 106" fill="none" stroke="#efffd0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- ほっぺ -->
  <ellipse cx="150" cy="384" rx="30" ry="18" fill="url(#sl-cheek)"/>
  <ellipse cx="362" cy="384" rx="30" ry="18" fill="url(#sl-cheek)"/>
  <path d="M140 380 l8 -6 M152 382 l8 -6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M352 380 l8 -6 M364 382 l8 -6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

</svg>
