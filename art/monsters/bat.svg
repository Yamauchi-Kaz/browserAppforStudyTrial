<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bt-body" cx="40%" cy="32%" r="72%">
      <stop offset="0" stop-color="#d9c2ff"/>
      <stop offset="0.35" stop-color="#9a6cf0"/>
      <stop offset="0.8" stop-color="#5b33b3"/>
      <stop offset="1" stop-color="#3b1f7e"/>
    </radialGradient>
    <linearGradient id="bt-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e6ff"/>
      <stop offset="1" stop-color="#b597ec"/>
    </linearGradient>
    <linearGradient id="bt-ear-in" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3cf"/>
      <stop offset="1" stop-color="#d9578f"/>
    </linearGradient>
    <linearGradient id="bt-mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0718"/>
      <stop offset="1" stop-color="#6e1438"/>
    </linearGradient>
    <clipPath id="bt-clip">
      <path id="bt-shape" d="M256 168 C340 168 386 224 386 300 C386 372 330 418 256 418 C182 418 126 372 126 300 C126 224 172 168 256 168 Z"/>
    </clipPath>
  </defs>

  <!-- 足 -->
  <g stroke="#241536" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M222 404 L216 448" fill="none" stroke-width="12"/>
    <path d="M222 404 L216 448" fill="none" stroke="#5b33b3" stroke-width="6"/>
    <path d="M290 404 L296 448" fill="none" stroke-width="12"/>
    <path d="M290 404 L296 448" fill="none" stroke="#5b33b3" stroke-width="6"/>
    <path d="M200 452 Q216 440 232 452 M206 452 l-6 12 M216 454 l0 13 M226 452 l6 12" fill="none" stroke="#1b1028" stroke-width="5"/>
    <path d="M280 452 Q296 440 312 452 M286 452 l-6 12 M296 454 l0 13 M306 452 l6 12" fill="none" stroke="#1b1028" stroke-width="5"/>
  </g>

  <!-- 耳 -->
  <g stroke="#241536" stroke-width="6" stroke-linejoin="round">
    <path d="M166 222 C150 170 140 120 142 74 C178 96 214 140 232 182 Z" fill="#7a4fd6"/>
    <path d="M170 204 C160 166 156 132 158 104 C182 124 204 152 216 182 Z" fill="url(#bt-ear-in)" stroke-width="3"/>
    <path d="M346 222 C362 170 372 120 370 74 C334 96 298 140 280 182 Z" fill="#6a40c4"/>
    <path d="M342 204 C352 166 356 132 354 104 C330 124 308 152 296 182 Z" fill="url(#bt-ear-in)" stroke-width="3"/>
  </g>

  <!-- 横の毛のふさ -->
  <path d="M134 300 L112 290 L128 318 L106 322 L134 340 Z" fill="#5b33b3" stroke="#241536" stroke-width="5" stroke-linejoin="round"/>
  <path d="M378 300 L400 290 L384 318 L406 322 L378 340 Z" fill="#4a2a9a" stroke="#241536" stroke-width="5" stroke-linejoin="round"/>
  <!-- 体 -->
  <use href="#bt-shape" fill="url(#bt-body)"/>
  <g clip-path="url(#bt-clip)">
    <!-- 右下のかげ -->
    <path d="M330 180 C410 230 420 360 330 430 L520 520 L520 160 Z" fill="#2d1566" opacity="0.4"/>
    <g transform="translate(0 52)">
    <!-- おなかの毛 -->
    <path d="M182 330 L196 316 L208 330 L222 314 L236 330 L250 312 L264 330 L278 314 L292 330 L306 316 L320 330 L334 318 C346 380 306 420 256 420 C206 420 166 380 182 330 Z" fill="url(#bt-belly)" stroke="#241536" stroke-width="4" stroke-linejoin="round"/>
    <path d="M222 360 q6 -8 12 0 M262 372 q6 -8 12 0 M240 396 q6 -8 12 0 M292 352 q6 -8 12 0" fill="none" stroke="#9d7ad8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- ふちの照りかえし -->
    <path d="M150 260 C140 300 148 340 170 370" fill="none" stroke="#e6d6ff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>
  <use href="#bt-shape" fill="none" stroke="#241536" stroke-width="7"/>

  <!-- 頭の毛 -->
  <path d="M220 176 L232 146 L246 170 L258 136 L270 170 L284 146 L294 176 Z" fill="#7a4fd6" stroke="#241536" stroke-width="5" stroke-linejoin="round"/>
  <!-- つや -->
  <path d="M168 238 C182 204 214 186 246 184 C222 198 198 216 186 246 C180 256 164 252 168 238 Z" fill="#ffffff" opacity="0.7"/>

  <!-- 鼻 -->
  <path d="M248 302 Q256 296 264 302 Q256 310 248 302 Z" fill="#3a1f60"/>
</svg>
